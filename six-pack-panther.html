<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibranium Volt | Energy Unleashed</title>
    <style>
        :root {
            --bg-color: #0b0b12;
            --card-bg: #16152b;
            --accent-purple: #8b5cf6;
            --accent-glow: #a855f7;
            --text-color: #e2e8f0;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            text-align: center;
            background: var(--card-bg);
            padding: 3rem 2rem;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.2);
            border: 1px solid rgba(168, 85, 247, 0.3);
            max-width: 400px;
            width: 90%;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 0 10px var(--accent-glow);
        }

        .tagline {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Graphic Can Container */
        .can-wrapper {
            position: relative;
            width: 140px;
            height: 260px;
            margin: 0 auto 2rem;
        }

        /* The Soda Can Styling */
        .can {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #111 0%, #2e1065 50%, #000 100%);
            border-radius: 20px 20px 15px 15px;
            position: relative;
            border: 2px solid var(--accent-purple);
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.4), inset 0 0 15px rgba(255, 255, 255, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Can Top Rim */
        .can::before {
            content: '';
            position: absolute;
            top: 0;
            width: 80%;
            height: 8px;
            background: #94a3b8;
            border-radius: 0 0 5px 5px;
        }

        /* Panther Claw/Necklace Graphic Element */
        .panther-emblem {
            width: 60px;
            height: 60px;
            border: 3px solid var(--accent-glow);
            transform: rotate(45deg);
            margin-bottom: 15px;
            box-shadow: 0 0 15px var(--accent-glow);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .panther-emblem-inner {
            width: 30px;
            height: 30px;
            background-color: var(--accent-glow);
        }

        .brand-name {
            font-weight: 900;
            font-size: 1.1rem;
            letter-spacing: 1px;
            color: #fff;
        }

        .flavor {
            font-size: 0.7rem;
            color: var(--accent-glow);
            margin-top: 4px;
            text-transform: uppercase;
        }

        /* CTA Button */
        .btn {
            background: linear-gradient(90deg, #7c3aed, #c084fc);
            color: #fff;
            border: none;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px var(--accent-glow);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Vibranium Volt</h1>
        <div class="tagline">Wakanda Forever • Energy Charged</div>

        <div class="can-wrapper">
            <div class="can">
                <div class="panther-emblem">
                    <div class="panther-emblem-inner"></div>
                </div>
                <div class="brand-name">VOLT</div>
                <div class="flavor">Purple Cosmic Berry</div>
            </div>
        </div>

        <button class="btn">Power Up</button>
    </div>

</body>
</html>
